name: 🚀 Feature Request
description: Propose a new feature, LLM provider, or prompt improvement for xGhost
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your idea to make xGhost even more powerful.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of the problem or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      placeholder: How should this work? Any specific UI or API design in mind?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any other tools or workarounds you've tried.
